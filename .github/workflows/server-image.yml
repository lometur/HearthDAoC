name: server-image

# Every PR: the full suite. Every push to main (a merge, or Run workflow on main): the full suite, and when
# files that ship changed since the last release, the same run publishes the next v<upstream>-hearth.<n>
# (deploy/release_tag.py next): image, tag and GitHub release with both bundles, all from this commit. A run
# for a commit older than a release publishes nothing, so re-running an old run cannot ship older code.
on:
  # Docs-only changes ship nothing (deploy/release_tag.py), so neither their PRs nor their merges run.
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", ".github/README.md"]
  pull_request:
    paths-ignore: ["docs/**", "*.md", ".github/README.md"]
  workflow_dispatch:  # on main: retry a release; on a branch: test only

# Runs on main wait for each other, so releases are made one at a time; a newer push to a PR cancels its run.
concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  test-build-publish:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # history and tags, to find what changed since the last release

      # Checked first so a problem fails before the long build. Set the repository variable HOLD_RELEASES to
      # keep main building without publishing.
      - name: Release to publish
        id: rel
        env:
          HOLD: ${{ vars.HOLD_RELEASES }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tag="$(python3 deploy/release_tag.py next)"
            if [[ -n "$tag" && -n "$HOLD" ]]; then echo "::notice::$tag is due, but HOLD_RELEASES is set."; tag=""; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # nasm assembles the client patch set's code cave (client/patches/src/baseclass.asm).
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3 bubblewrap nasm

      - name: Fetch a clean classic world for tests (database only)
        run: python3 deploy/bin/init_world.py --lock deploy/upstream.lock --data "$RUNNER_TEMP/world" --edition classic --skip-navmesh

      # The files client/patches/classic-creation.json patches (the classic edition's game.dll and two
      # pregame files), from the pinned release and verified like every download, for the client patch
      # tests and the patch-set check. They are EA files: they stay in $RUNNER_TEMP, outside the checkout
      # (so never in the image's build context), for this run only, and no step uploads them.
      - name: Fetch the classic client files the patch set patches (tests only, never published)
        run: |
          lock=deploy/upstream.lock
          app="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["client_prefix"])' "$lock")"
          dll="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["editions"]["classic"]["game_dll"])' "$lock")"
          python3 tools/linux/odaoc_fetch.py --lock "$lock" extract "$dll" "$RUNNER_TEMP/classic-client/game.dll"
          for f in pregame/character_customize_stats.xml pregame/splash.mpk; do
            python3 tools/linux/odaoc_fetch.py --lock "$lock" extract "$app$f" "$RUNNER_TEMP/classic-client/$f"
          done

      # Only the splash.mpk builder's tests use it: client/patches/splash.mpk is built before a commit, not here.
      - name: Build upstream's MPK tool (for the splash.mpk builder's tests)
        run: dotnet build source/tools/OfflineDaoc.Mpk/OfflineDaoc.Mpk.csproj -c Release --nologo

      - name: Build Linux CLIs
        run: tools/linux/build.sh "$RUNNER_TEMP/tools"

      - name: Unit tests
        env:
          HDC_TEST_WORLD: ${{ runner.temp }}/world/world/opendaoc.sqlite3.db
          HDC_TOOLS: ${{ runner.temp }}/tools
          HDC_CLIENT_FILES: ${{ runner.temp }}/classic-client
          HDC_MPK_TOOL: ${{ github.workspace }}/source/tools/OfflineDaoc.Mpk/bin/Release/net10.0/OfflineDaoc.Mpk.dll
          HDC_PWSH: pwsh  # preinstalled on GitHub's Ubuntu runners; named, so the PowerShell cases can't skip
        run: |
          python3 -m unittest discover -s tools/linux/tests -t tools/linux -v
          python3 -m unittest discover -s deploy/tests -t deploy -v
          python3 -m unittest discover -s client/tests -t client -v
          python3 -m unittest discover -s client/patches/tests -t client/patches -v

      # classic-creation.json is generated by client/patches/build.py and committed. It must be exactly
      # what the generator makes from the pinned release's files, this commit's sources and the committed
      # splash.mpk (whose SHA-256 it pins).
      - name: Client patch set matches a rebuild
        env:
          HDC_TEST_WORLD: ${{ runner.temp }}/world/world/opendaoc.sqlite3.db
          HDC_CLIENT_FILES: ${{ runner.temp }}/classic-client
        run: |
          python3 -B client/patches/build.py --client "$HDC_CLIENT_FILES" --world-db "$HDC_TEST_WORLD" \
            --server-src source/server --splash-mpk client/patches/splash.mpk --out "$RUNNER_TEMP/classic-creation.json"
          if ! diff -u client/patches/classic-creation.json "$RUNNER_TEMP/classic-creation.json"; then
            echo "::error file=client/patches/classic-creation.json::out of date: rebuild it with client/patches/build.py (docs/fork/FORK.md, Client patches)"
            exit 1
          fi

      - name: Server unit tests for the fork's server changes
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "0"
        run: |
          # The server build copies config/serverconfig.xml; use the same loopback placeholder as the image build.
          cp deploy/serverconfig.build.xml source/server/CoreServer/config/serverconfig.xml
          dotnet test source/server/Tests/Tests.csproj --nologo --filter "FullyQualifiedName~UT_CommandPrivLevelOverrides|FullyQualifiedName~UT_SiStartChoice|FullyQualifiedName~UT_ClassicBattlegrounds"

      - name: CLI integration tests
        env:
          HDC_TEST_WORLD: ${{ runner.temp }}/world/world/opendaoc.sqlite3.db
        run: tools/linux/tests/test_cli_tools.sh "$RUNNER_TEMP/tools"

      - name: Build image
        run: docker build -f deploy/Dockerfile -t hearthdaoc:ci .

      - name: Smoke test
        run: deploy/tests/smoke.sh hearthdaoc:ci

      - name: Compose and hdc integration test
        run: deploy/tests/hdc_integration.sh hearthdaoc:ci

      - name: Publish image (releases only)
        if: steps.rel.outputs.tag != ''
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img="ghcr.io/${{ github.repository_owner }}/hearthdaoc:$TAG"
          docker tag hearthdaoc:ci "$img"
          docker push "$img"
  release-assets:
    needs: test-build-publish
    if: needs.test-build-publish.outputs.release != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.test-build-publish.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - name: Build bundles (no EA files)
        run: deploy/build_bundles.sh "$TAG" dist
      - name: Create release (and its tag on this commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upstream="$(python3 -c 'import json;print(json.load(open("deploy/upstream.lock"))["version"])')"
          gh release create "$TAG" "dist/hearthdaoc-deploy-$TAG.tar.gz" "dist/hearthdaoc-client-$TAG.zip" \
            --target "$GITHUB_SHA" --title "$TAG" --latest --generate-notes \
            --notes "HearthDAoC, an unofficial fork of shadowofze/OfflineDAoC (upstream $upstream). Image: ghcr.io/lometur/hearthdaoc:$TAG.
          Server: \`./hdc update\` (or HANDOFF.md in the deploy bundle). Players: README.md in the client bundle.
          The client's loading splash is OfflineDAoC's art, re-lettered HEARTH DAoC (Cinzel font, SIL Open Font License). Credit for the artwork goes to shadowofze/OfflineDAoC."
