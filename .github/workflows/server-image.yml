name: server-image

on:
  push:
    branches: [main]
    tags: ["v*-hearth.*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-build-publish:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, to know whether the docs name an unpublished release

      # A release is published for a pushed tag, or on main when a merged release PR names a new tag
      # (deploy/release_tag.py; .github/workflows/release-pr.yml opens those PRs). Checked first so a
      # mismatch fails before the long build.
      - name: Release to publish
        id: rel
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then tag="$(python3 deploy/release_tag.py pending)"
          fi
          if [[ -n "$tag" ]]; then python3 deploy/release_tag.py check "$tag"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3 bubblewrap

      - name: Fetch a clean classic world for tests (database only)
        run: python3 deploy/bin/init_world.py --lock deploy/upstream.lock --data "$RUNNER_TEMP/world" --edition classic --skip-navmesh

      - name: Build Linux CLIs
        run: tools/linux/build.sh "$RUNNER_TEMP/tools"

      - name: Unit tests
        env:
          HDC_TEST_WORLD: ${{ runner.temp }}/world/world/opendaoc.sqlite3.db
          HDC_TOOLS: ${{ runner.temp }}/tools
        run: |
          python3 -m unittest discover -s tools/linux/tests -t tools/linux -v
          python3 -m unittest discover -s deploy/tests -t deploy -v
          python3 -m unittest discover -s client/tests -t client -v

      - name: Server unit tests for the fork's server changes
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "0"
        run: |
          # The server build copies config/serverconfig.xml; use the same loopback placeholder as the image build.
          cp deploy/serverconfig.build.xml source/server/CoreServer/config/serverconfig.xml
          dotnet test source/server/Tests/Tests.csproj --nologo --filter "FullyQualifiedName~UT_CommandPrivLevelOverrides"

      - name: CLI integration tests
        env:
          HDC_TEST_WORLD: ${{ runner.temp }}/world/world/opendaoc.sqlite3.db
        run: tools/linux/tests/test_cli_tools.sh "$RUNNER_TEMP/tools"

      - name: Build image
        run: docker build -f deploy/Dockerfile -t hearthdaoc:ci .

      - name: Smoke test
        run: deploy/tests/smoke.sh hearthdaoc:ci

      - name: Compose and hdc integration test
        run: deploy/tests/hdc_integration.sh hearthdaoc:ci

      - name: Publish image (releases only)
        if: steps.rel.outputs.tag != ''
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img="ghcr.io/${{ github.repository_owner }}/hearthdaoc:$TAG"
          docker tag hearthdaoc:ci "$img"
          docker push "$img"
  release-assets:
    needs: test-build-publish
    if: needs.test-build-publish.outputs.release != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.test-build-publish.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Build bundles (no EA files)
        run: deploy/build_bundles.sh "$TAG" dist
      - name: Create release (and its tag on this commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upstream="$(python3 -c 'import json;print(json.load(open("deploy/upstream.lock"))["version"])')"
          {
            python3 deploy/release_tag.py notes "$TAG"
            echo
            echo "HearthDAoC, an unofficial fork of shadowofze/OfflineDAoC (upstream $upstream). Image: ghcr.io/lometur/hearthdaoc:$TAG."
            echo "Server: \`./hdc update $TAG\` (or HANDOFF.md in the deploy bundle). Players: README.md in the client bundle."
          } > notes.md
          gh release create "$TAG" dist/hearthdaoc-deploy-*.tar.gz dist/hearthdaoc-client-*.zip \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
