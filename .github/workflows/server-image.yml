name: server-image

on:
  push:
    branches: [main]
    tags: ["v*-hearth.*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-build-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sqlite3 bubblewrap

      - name: Fetch a clean classic world for tests (database only)
        run: python3 deploy/bin/init_world.py --lock deploy/upstream.lock --data "$RUNNER_TEMP/world" --edition classic --skip-navmesh

      - name: Build Linux CLIs
        run: tools/linux/build.sh "$RUNNER_TEMP/tools"

      - name: Unit tests
        env:
          HDC_TEST_WORLD: ${{ runner.temp }}/world/world/opendaoc.sqlite3.db
          HDC_TOOLS: ${{ runner.temp }}/tools
        run: |
          python3 -m unittest discover -s tools/linux/tests -t tools/linux -v
          python3 -m unittest discover -s deploy/tests -t deploy -v
          python3 -m unittest discover -s client/tests -t client -v

      - name: Server unit tests for the fork's server changes
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "0"
        run: |
          # The server build copies config/serverconfig.xml; use the same loopback placeholder as the image build.
          cp deploy/serverconfig.build.xml source/server/CoreServer/config/serverconfig.xml
          dotnet test source/server/Tests/Tests.csproj --nologo --filter "FullyQualifiedName~UT_CommandPrivLevelOverrides"

      - name: CLI integration tests
        env:
          HDC_TEST_WORLD: ${{ runner.temp }}/world/world/opendaoc.sqlite3.db
        run: tools/linux/tests/test_cli_tools.sh "$RUNNER_TEMP/tools"

      - name: Build image
        run: docker build -f deploy/Dockerfile -t hearthdaoc:ci .

      - name: Smoke test
        run: deploy/tests/smoke.sh hearthdaoc:ci

      - name: Compose and hdc integration test
        run: deploy/tests/hdc_integration.sh hearthdaoc:ci

      - name: Publish image (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img="ghcr.io/${{ github.repository_owner }}/hearthdaoc:${{ github.ref_name }}"
          docker tag hearthdaoc:ci "$img"
          docker push "$img"
  release-assets:
    needs: test-build-publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build bundles (no EA files)
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist/deploy "dist/client/hearthdaoc-client-$tag/windows"
          cp deploy/compose.yml deploy/.env.example deploy/hdc deploy/HANDOFF.md deploy/upstream.lock dist/deploy/
          sed -i "s/^HEARTHDAOC_TAG=.*/HEARTHDAOC_TAG=$tag/" dist/deploy/.env.example
          tar czf "dist/hearthdaoc-deploy-$tag.tar.gz" -C dist/deploy .
          c="dist/client/hearthdaoc-client-$tag"
          cp client/README.md client/linux/setup.sh client/linux/play.sh.in tools/linux/odaoc_fetch.py deploy/upstream.lock "$c/"
          cp client/windows/connect-hearthdaoc.bat "$c/windows/"
          (cd dist/client && zip -qr "../hearthdaoc-client-$tag.zip" "hearthdaoc-client-$tag")
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/hearthdaoc-deploy-*.tar.gz dist/hearthdaoc-client-*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "HearthDAoC, an unofficial fork of shadowofze/OfflineDAoC (upstream $(python3 -c 'import json;print(json.load(open("deploy/upstream.lock"))["version"])')). Image: ghcr.io/lometur/hearthdaoc:$GITHUB_REF_NAME. Deploy: see HANDOFF.md in the deploy bundle. Players: see README.md in the client bundle."
