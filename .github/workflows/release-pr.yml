name: release-pr

# After each merge to main: if files that go into the image or the bundles changed since the last release,
# open (or update) one "Release vX-hearth.N" PR that bumps the docs to the next tag and adds its changelog
# entry. Merging that PR is the release: the server-image workflow on main then publishes it.
on:
  push:
    branches: [main]
  # Also after every build on main: a merge that lands while a release is still publishing is skipped as
  # "pending", and this brings it back once the release exists.
  workflow_run:
    workflows: [server-image]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Plan
        id: plan
        run: python3 deploy/release_tag.py plan | tee -a "$GITHUB_OUTPUT"

      - name: Open or update the release PR
        if: steps.plan.outputs.action == 'release-pr'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C release/next
          python3 deploy/release_tag.py prepare "$TAG"
          git add deploy/.env.example deploy/HANDOFF.md docs/fork/CHANGELOG.md
          git commit -q -m "chore(release): $TAG"
          git push -q --force origin release/next
          {
            echo "Merging this PR releases **$TAG**: the build on main then publishes the image, the tag and the bundles."
            echo
            echo "## Changes"
            echo
            python3 deploy/release_tag.py notes "$TAG"
            echo
            echo "After it is published, update the server with \`./hdc update $TAG\`."
          } > body.md
          number="$(gh pr list --head release/next --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f title="Release $TAG" -F body=@body.md >/dev/null
          else
            gh pr create --base main --head release/next --title "Release $TAG" --body-file body.md
          fi
